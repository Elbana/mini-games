<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fast Farm</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/arcade-shell.css">
  <link rel="stylesheet" href="/fast-farm/game.css">
  <script src="/shared/arcade-api.js"></script>
  <script src="/fast-farm/game.js" defer></script>
</head>
<body>
  <div id="app" class="farm-screen">
    <div class="farm-bg" aria-hidden="true"></div>
    <div class="farm-gradient" aria-hidden="true"></div>

    <div id="farm-scene" class="farm-scene">
      <div id="farm-grid" class="farm-grid" role="grid" aria-label="Farm plots"></div>
    </div>

    <div class="farm-ui">
      <header class="farm-top-bar">
        <a class="farm-back-btn" id="btn-hub" href="/" aria-label="Back to hub">‹</a>
        <p class="farm-daily-mood" id="farm-daily-mood">🌤️ Loading farm mood…</p>
      </header>
      <div id="farm-crop-stack" class="farm-crop-stack" aria-label="Harvested crops"></div>
    </div>

    <div id="toast-zone" class="farm-toast-zone" aria-live="polite"></div>
    <div id="fx-layer" aria-hidden="true"></div>

    <div id="sheet-plot" class="farm-sheet hidden" role="dialog" aria-modal="true">
      <div class="sheet-backdrop" data-close="sheet-plot"></div>
      <div class="sheet-panel sheet-plot">
        <div class="sheet-handle"></div>
        <header class="sheet-header compact">
          <h2 id="plot-sheet-title">Plot</h2>
        </header>
        <div id="plot-sheet-body" class="plot-sheet-body"></div>
      </div>
    </div>

  </div>
</body>
</html>
