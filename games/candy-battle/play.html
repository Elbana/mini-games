<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Candy Battle</title>
  <link rel="stylesheet" href="/shared/arcade-shell.css">
  <link rel="stylesheet" href="/candy-battle/game.css">
  <script src="/shared/arcade-api.js"></script>
  <script src="/shared/profile.js"></script>
  <script src="/shared/fx.js"></script>
  <script type="module" src="/candy-battle/game.js"></script>
</head>
<body>
  <div class="arcade-shell candy-world" id="app">
    <div class="candy-bg" aria-hidden="true"></div>
    <header class="top-bar">
      <a class="btn btn-ghost btn-sm" href="/">← Hub</a>
      <h1>Candy Battle</h1>
      <div class="top-bar-actions">
        <button type="button" class="player-chip" id="player-chip" hidden></button>
        <button type="button" class="btn btn-ghost btn-sm sound-toggle" id="btn-sound" aria-pressed="false" aria-label="Sound on">🔊</button>
        <div class="balance-pill" id="balance">…</div>
      </div>
    </header>

    <div id="screen-fight" class="screen">
      <div class="arena-panel">
        <div class="monster-stage">
          <div class="monster-aura" aria-hidden="true"></div>
          <div class="monster-sprite" id="monster-sprite">👾</div>
          <div class="monster-shadow"></div>
        </div>
        <div class="battle-hud">
          <div class="fighter player-side">
            <span class="fighter-label">You</span>
            <div class="hp-bar"><div class="hp-fill player" id="player-hp"></div></div>
            <b class="hp-num" id="player-hp-num">0</b>
          </div>
          <div class="vs-badge">VS</div>
          <div class="fighter monster-side">
            <span class="fighter-label" id="monster-name">Monster</span>
            <div class="hp-bar"><div class="hp-fill monster" id="monster-hp"></div></div>
            <b class="hp-num" id="monster-hp-num">0</b>
          </div>
        </div>
      </div>
      <div class="diff-picker" id="diff-picker"></div>
      <p class="candy-ammo" id="season-line">Season 1</p>
      <div class="board-wrap">
        <div id="board" class="board"></div>
      </div>
      <div class="tool-row" id="tool-row"></div>
    </div>

    <div id="fx-layer" aria-hidden="true"></div>
    <div id="combo-layer" aria-hidden="true"></div>

    <div id="overlay-result" class="overlay hidden">
      <div class="result-card card">
        <div class="result-icon" id="result-icon">🏆</div>
        <h2 id="result-title">Victory!</h2>
        <p id="result-detail"></p>
        <div class="diff-picker" id="result-diff"></div>
        <a class="btn btn-ghost" id="result-sell" href="/play/market" target="_blank" rel="noopener">Sell candy ↗</a>
        <button class="btn btn-gold" id="btn-continue">Next fight</button>
      </div>
    </div>
  </div>
</body>
</html>
